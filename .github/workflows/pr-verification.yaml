name: PR Validation
on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  setup:
    name: Lint
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: NPM install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
